/* ============ PWA 安裝為桌面／主畫面 App ============ */
let deferredInstallPrompt = null;
function isStandaloneDisplay(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(currentView==='members') render();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  toast('已安裝到裝置');
  if(currentView==='members') render();
});
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
function installApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(()=>{ deferredInstallPrompt=null; if(currentView==='members') render(); });
    return;
  }
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  if(isIOS){
    alert('在 iPhone / iPad 上安裝：\n\n1. 用 Safari 打開這個網頁\n2. 點下方工具列的「分享」圖示\n3. 選擇「加入主畫面」');

  }
}

/* ============ Currency rates (1 單位外幣 = ? 台幣) ============ */
function getRate(cur){
  const r = (currencyRates||{})[cur];
  return (typeof r==='number' && r>0) ? r : null;
}
// 現金支出的即時台幣金額：有匯率就用「目前」匯率換算（跟著匯率頁更新），沒有就退回存檔當下的金額。
// 信用卡外幣支出若尚未填入台幣金額（帳單還沒來），也先套用已設定的匯率回推估算金額，
// 避免分析／結算頁在帳單確認前把這筆支出當成 0 元計算；一旦填了台幣金額（帳單實際金額），
// 則一律以該金額為準，不再用匯率覆蓋。
function liveTwdAmount(e){
  if(e.currency && e.currency!=='TWD' && e.currency!=='外幣'){
    if(e.paymethod==='cash'){
      const rate = getRate(e.currency);
      if(rate!=null) return (e.foreignAmount||0) * rate;
    } else if(e.paymethod==='card' && !e.twdAmount && e.foreignAmount){
      const rate = getRate(e.currency);
      if(rate!=null) return e.foreignAmount * rate;
    }
  }
  return e.twdAmount||0;
}
// 對應到單一受益人的即時台幣分攤金額（現金與尚未確認金額的信用卡外幣支出都適用）
function liveBenefTwd(e, b){
  if(e.currency && e.currency!=='TWD' && e.currency!=='外幣' && b.foreignAmount!=null){
    if(e.paymethod==='cash'){
      const rate = getRate(e.currency);
      if(rate!=null) return b.foreignAmount * rate;
    } else if(e.paymethod==='card' && !e.twdAmount){
      const rate = getRate(e.currency);
      if(rate!=null) return b.foreignAmount * rate;
    }
  }
  return b.amount||0;
}
// 現金外幣支出的即時狀態：有匯率就視為已確認，沒有就是估算中
function liveStatus(e){
  if(e.paymethod==='cash' && e.currency && e.currency!=='TWD' && e.currency!=='外幣'){
    return getRate(e.currency)!=null ? 'confirmed' : 'estimated';
  }
  return e.status;
}

/* ============ Boot ============ */
// 手機瀏覽器（尤其 iOS，含 Chrome/Safari/Edge，底層都是同一套引擎）用「跳出視窗」做 Google 登入
// 常會因為兩個視窗間存取不到同一份暫存資料而失敗（missing initial state 錯誤）。
// 手機一律改用「整頁跳轉」登入，桌機維持跳出視窗（比較不會打斷操作）。
function isMobileDevice(){
  return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
}
function friendlyAuthErrorMsg(err){
  if(!err) return '未知錯誤';
  if(err.message && /missing initial state/i.test(err.message)) return '瀏覽器暫存資料無法讀取（常見於無痕模式）';
  return err.message || err.code || '未知錯誤';
}
function boot(){
  renderShell(`<div class="empty" style="padding-top:80px">連線中…</div>`);
  // 簡化流程：只讓 onAuthStateChanged 負責觸發畫面渲染（使用者登入完成後一定會觸發一次）。
  // getRedirectResult() 只用來攔截「整頁跳轉登入」流程中可能發生的錯誤並直接顯示錯誤代碼，
  // 不再額外呼叫渲染，避免兩個非同步流程互相搶跑造成畫面重複刷新。
  auth.getRedirectResult().catch(err=>{
    if(err && err.code && err.code!=='auth/no-current-user' && err.code!=='auth/null-user'){
      alert('Google 登入失敗（錯誤代碼：'+err.code+'）\n'+friendlyAuthErrorMsg(err)+'\n\n請把這個訊息截圖回報，方便進一步排查。');
    }
  });
  auth.onAuthStateChanged(user=>{
    if(user){ tryResumeLocal(); }
    else {
      const params = new URLSearchParams(location.search);
      renderHome(params.get('trip'));
    }
  });
}
function ensureAuthed(cb){
  if(auth.currentUser){ cb(); return; }
  auth.signInAnonymously().then(()=>cb()).catch(err=> alert('連線失敗：'+err.message));
}

function tryResumeLocal(){
  const params = new URLSearchParams(location.search);
  const urlCode = params.get('trip');
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LOCAL_KEY)); }catch(e){}

  const sameTripAsUrl = saved && saved.tripId && (!urlCode || urlCode.toUpperCase()===saved.tripId.toUpperCase());

  if(saved && saved.tripId && sameTripAsUrl){
    db.collection('trips').doc(saved.tripId).get().then(doc=>{
      if(doc.exists){
        tripId = saved.tripId; myMemberId = saved.memberId; myMemberName = saved.memberName;
        tripName = doc.data().name || '旅程';
        enterTrip();
      } else {
        localStorage.removeItem(LOCAL_KEY);
        renderHome(urlCode);
      }
    });
  } else {
    // 網址帶的邀請碼跟本機目前記住的旅程不同（例如點了旅伴傳來的邀請連結），
    // 優先讓使用者加入網址上指定的新旅程，而不是默默恢復原本的舊旅程。
    renderHome(urlCode);
  }
}

/* ============ Home (create / join) ============ */
function renderHome(prefillCode){
  const isGoogle = auth.currentUser && !auth.currentUser.isAnonymous;
  if(isGoogle){
    db.collection('trips').where('ownerUid','==',auth.currentUser.uid).get().then(snap=>{
      const myTrips = snap.docs.map(d=>({id:d.id, ...d.data()}))
        .sort((a,b)=> (b.createdAt? b.createdAt.seconds:0) - (a.createdAt? a.createdAt.seconds:0));
      renderHomeInner(prefillCode, isGoogle, myTrips);
    }).catch(()=> renderHomeInner(prefillCode, isGoogle, []));
  } else {
    renderHomeInner(prefillCode, isGoogle, []);
  }
}

// esc(): 用於 onclick="fn('${...}')" 這類「雙引號屬性裡包一段單引號 JS 字串」的場合 —
// 只需處理反斜線／單引號／雙引號，讓瀏覽器解析屬性、還原成 JS 字串時不會被使用者輸入的內容跳脫出去。
function esc(str){ return String(str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
// escHtml(): 用於把使用者輸入（姓名、標題、次分類、旅程名稱等）當成「畫面上顯示的文字內容」
// 或「一般屬性值（如 value="..."）」插入 innerHTML 時使用，避免使用者輸入的 <script> 等標籤被瀏覽器當成真的 HTML 執行
// （多人共編情境下，任何協作者的輸入都必須視為不可信任內容）。
function escHtml(str){
  return String(str==null?'':str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

/* ============ App 內建瀏覽器（in-app browser）偵測 ============
   Messenger／Instagram／LINE／TikTok 等 App 內建瀏覽器常會限制或隔離 sessionStorage，
   導致 Google 登入（signInWithPopup）失敗並出現「missing initial state」錯誤。
   偵測到這類環境時提醒使用者改用系統瀏覽器開啟，避免卡在看不懂的英文錯誤畫面。 */
function isInAppBrowser(){
  const ua = navigator.userAgent || navigator.vendor || window.opera || '';
  return /FBAN|FBAV|Messenger|Instagram|Line\/|MicroMessenger|TikTok|musical_ly|Snapchat/i.test(ua);
}
function inAppBrowserBannerHtml(){
  if(!isInAppBrowser()) return '';
  return `
  <div class="banner" style="margin-bottom:16px">
    ⚠️ 偵測到你目前是用 App 內建的瀏覽器開啟（例如 Messenger、Instagram、LINE），部分功能（特別是 Google 登入）可能無法正常運作，甚至出現錯誤畫面。
    <div class="hint" style="margin:6px 0 0">建議點畫面右上角或右下角的「⋯」選單，選擇「用瀏覽器開啟」或「在 Safari／Chrome 中開啟」。</div>
    <div class="footer-actions" style="margin-top:10px">
      <button class="btn ghost sm" onclick="copyCurrentUrl()">📋 複製這個連結</button>
    </div>
  </div>`;
}
function copyCurrentUrl(){
  const ta = document.createElement('textarea');
  ta.value = location.href; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已複製連結，請貼到瀏覽器打開'); }
  catch(e){ navigator.clipboard?.writeText(location.href); toast('已複製連結'); }
  ta.remove();
}

function renderHomeInner(prefillCode, isGoogle, myTrips){
  const tripListHtml = (isGoogle && myTrips.length) ? `
    <label>你名下的旅程</label>
    ${myTrips.map(t=>`
      <div class="namechip" style="justify-content:space-between">
        <div onclick="switchToMyTrip('${t.id}')" style="flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0">
          <div class="avatar" style="width:26px;height:26px;font-size:13px">${t.icon||'📒'}</div>
          <div style="min-width:0">
            <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(t.name)}</div>
            <div class="hint">邀請碼 ${t.id}</div>
          </div>
        </div>
        <button class="btn ghost sm" onclick="event.stopPropagation();renameTripPrompt('${t.id}','${esc(t.name)}')">✎</button>
      </div>`).join('')}
    <div class="divider"></div>
  ` : '';
  const createBlock = isGoogle ? `
    <label>建立新旅程</label>
    <input type="text" id="newTripName" placeholder="例如：沖繩家族旅行">
    <button class="btn brass block" style="margin-top:8px" onclick="createTrip()">建立旅程</button>
    <div class="hint" style="margin-top:6px">已用 ${(auth.currentUser.displayName||auth.currentUser.email||'Google 帳號')} 登入 · <span style="color:var(--teal);text-decoration:underline;cursor:pointer" onclick="signOutGoogle()">登出</span></div>
  ` : `
    <label>建立新旅程</label>
    <div class="hint" style="margin-bottom:8px">建立旅程需要用 Google 帳號登入，確保只有你能刪除整個旅程；加入既有旅程不需要登入。</div>
    <button class="btn brass block" onclick="signInGoogleThenCreate()">使用 Google 登入以建立旅程</button>
  `;
  const html = `
  <div class="home-wrap">
    <div class="home-card">
      <div class="home-title">📒 旅費帳本</div>
      <div class="home-sub">家庭旅遊記帳與分帳，可多人共編</div>

      ${inAppBrowserBannerHtml()}
      ${tripListHtml}
      ${createBlock}

      <div class="divider">或</div>

      <label>輸入邀請碼加入</label>
      <input type="text" id="joinCode" maxlength="6" style="text-transform:uppercase; letter-spacing:2px; text-align:center; font-family:'Roboto Mono',monospace;" placeholder="ABC123" value="${prefillCode? prefillCode.toUpperCase():''}">
      <button class="btn ghost block" style="margin-top:8px" onclick="joinTripByCode()">加入旅程</button>
    </div>
  </div>`;
  renderShell(html, true);
  if(prefillCode) setTimeout(()=>joinTripByCode(), 100);
}

function switchToMyTrip(id){
  ensureAuthed(()=>{
    db.collection('trips').doc(id).get().then(doc=>{
      if(!doc.exists){ alert('這個旅程已經不存在了'); renderHome(); return; }
      const data = doc.data();
      tripId = id; tripName = data.name || '旅程';
      if(data.creatorMemberId){
        db.collection('trips').doc(id).collection('members').doc(data.creatorMemberId).get().then(mdoc=>{
          if(mdoc.exists){ pendingIsCreator=false; pickMember(data.creatorMemberId, mdoc.data().name); }
          else { renderNamePicker(true); }
        });
      } else {
        renderNamePicker(true);
      }
    });
  });
}

function renameTripPrompt(id, currentName){
  const name = prompt('輸入新的旅程名稱：', currentName);
  if(!name || !name.trim() || name.trim()===currentName) return;
  db.collection('trips').doc(id).update({name:name.trim()}).then(()=>{
    toast('已更新旅程名稱');
    if(tripId===id){ tripName=name.trim(); render(); } else { renderHome(); }
  }).catch(err=> alert('更新失敗：'+err.message));
}

function signInGoogleThenCreate(){
  if(isInAppBrowser()){
    if(!confirm('偵測到你目前是用 App 內建瀏覽器（例如 Messenger、Instagram、LINE），Google 登入很可能會失敗或出現錯誤畫面。\n\n建議先用右上／右下角選單「用瀏覽器開啟」，改用 Safari 或 Chrome 再試一次。\n\n仍要嘗試登入嗎？')) return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  if(isMobileDevice()){
    // 手機一律用整頁跳轉登入，避免跳出視窗在手機瀏覽器上常見的暫存資料同步失敗問題。
    // 跳轉後回到頁面時，boot() 裡的 getRedirectResult 會接手處理登入結果並重新渲染畫面。
    auth.signInWithRedirect(provider).catch(err=>{
      if(err.code === 'auth/unauthorized-domain'){
        alert('這個網址還沒被 Firebase 授權可以用 Google 登入。請到 Authentication → Settings → 授權網域加入目前的網域，且這個檔案需要放到網站上才能用 Google 登入，不能用檔案總管直接雙擊開啟。');
      } else {
        alert('登入失敗：'+friendlyAuthErrorMsg(err));
      }
    });
    return;
  }
  auth.signInWithPopup(provider).then(()=>{ renderHome(); })
    .catch(err=>{
      if(err.code === 'auth/popup-closed-by-user') return;
      if(err.code === 'auth/unauthorized-domain'){
        alert('這個網址還沒被 Firebase 授權可以用 Google 登入。請到 Authentication → Settings → 授權網域加入目前的網域，且這個檔案需要放到網站上（例如 GitHub Pages）才能用 Google 登入，不能用檔案總管直接雙擊開啟。');
      } else {
        alert('登入失敗：'+friendlyAuthErrorMsg(err));
      }
    });
}
function signOutGoogle(){ auth.signOut().then(()=> renderHome()); }

function createTrip(){
  if(!auth.currentUser || auth.currentUser.isAnonymous){ alert('請先用 Google 登入才能建立旅程'); return; }
  const name = document.getElementById('newTripName').value.trim();
  if(!name){ alert('請輸入旅程名稱'); return; }
  const code = genCode();
  db.collection('trips').doc(code).set({
    name, icon:'📒', createdAt: firebase.firestore.FieldValue.serverTimestamp(), subcats:[], currencies:[], currencyRates:{},
    ownerUid: auth.currentUser.uid
  }).then(()=>{
    tripId = code; tripName = name;
    renderNamePicker(true);
  }).catch(err=> alert('建立失敗：'+err.message));
}

function joinTripByCode(){
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if(!code){ alert('請輸入邀請碼'); return; }
  ensureAuthed(()=>{
    db.collection('trips').doc(code).get().then(doc=>{
      if(!doc.exists){ alert('找不到這個邀請碼，請確認是否輸入正確'); return; }
      tripId = code; tripName = doc.data().name || '旅程';
      renderNamePicker(false);
    });
  });
}

function renderNamePicker(isCreator){
  pendingIsCreator = isCreator;
  db.collection('trips').doc(tripId).collection('members').get().then(snap=>{
    const existing = snap.docs.map(d=>({id:d.id, ...d.data()}));

    /* 自動恢復身份：如果這個瀏覽器/帳號（uid）先前已經認領過此旅程裡的某個成員，
       就直接以該身份繼續，不再顯示選人畫面，避免誤選成別人。 */
    const mine = auth.currentUser ? existing.find(m=> m.claimedUid && m.claimedUid===auth.currentUser.uid) : null;
    if(mine){
      pendingIsCreator = false;
      pickMember(mine.id, mine.name);
      return;
    }

    const chips = existing.map(m=>{
      const claimedByOther = !!(m.claimedUid && auth.currentUser && m.claimedUid!==auth.currentUser.uid);
      const nameEsc = esc(m.name);
      const clickFn = claimedByOther
        ? `confirmClaimOther('${m.id}','${nameEsc}')`
        : `pickMember('${m.id}','${nameEsc}')`;
      return `
      <div class="namechip ${claimedByOther?'claimedother':''}" onclick="${clickFn}">
        <div class="avatar" style="width:26px;height:26px;font-size:11px">${escHtml(initials(m.name))}</div>${escHtml(m.name)}
        ${claimedByOther? ' <span class="hint">（可能已有人在用，點擊需確認）</span>':''}
      </div>`;
    }).join('');
    const html = `
    <div class="home-wrap">
      <div class="home-card">
        <div class="home-title">${escHtml(tripName)}</div>
        <div class="home-sub">${isCreator? '旅程已建立，先選你自己的名字' : '你是這趟旅程的哪一位？'}</div>
        ${chips}
        <div class="divider">${existing.length? '或新增':''}</div>
        <label>${existing.length? '不在名單中？新增我的名字':'輸入你的名字'}</label>
        <input type="text" id="myName" placeholder="輸入姓名">
        <button class="btn brass block" style="margin-top:8px" onclick="addAndPickMember()">加入旅程</button>
        ${isCreator? `<div class="divider">分享給旅伴</div><div class="codebig">${tripId}</div><button class="btn brass block" onclick="shareInviteLink()">🔗 分享邀請連結</button><div class="hint" style="text-align:center;margin-top:8px">點連結的人會自動帶入邀請碼；也可以直接把上面的邀請碼給對方，讓他自己輸入</div>`:''}
      </div>
    </div>`;
    renderShell(html, true);
  });
}

function confirmClaimOther(id, name){
  if(confirm(`「${name}」這個身份似乎已經有其他裝置在使用了。\n\n如果這其實就是你自己（例如你換了瀏覽器或清除過資料），可以繼續；如果這是旅伴的名字，請不要選它，改選你自己的名字或在下方新增。\n\n確定要以「${name}」的身份繼續嗎？`)){
    pickMember(id, name);
  }
}

function pickMember(id, name){
  myMemberId = id; myMemberName = name;
  if(pendingIsCreator && tripId){
    db.collection('trips').doc(tripId).update({creatorMemberId:id}).catch(()=>{});
  }
  pendingIsCreator = false;
  if(auth.currentUser){
    tripRef().collection('members').doc(id).set({claimedUid: auth.currentUser.uid}, {merge:true}).catch(()=>{});
  }
  localStorage.setItem(LOCAL_KEY, JSON.stringify({tripId, memberId:id, memberName:name}));
  enterTrip();
}
function addAndPickMember(){
  const name = document.getElementById('myName').value.trim();
  if(!name){ alert('請輸入名字'); return; }
  const id = uid();
  const data = {name};
  if(auth.currentUser) data.claimedUid = auth.currentUser.uid;
  tripRef().collection('members').doc(id).set(data).then(()=>{
    pickMember(id, name);
  });
}

/* ============ Enter trip: subscribe to realtime data ============ */
function enterTrip(){
  unsubs.forEach(u=>u());
  unsubs = [];
  syncing = true;
  renderShell(`<div class="empty" style="padding-top:80px">載入旅程資料…</div>`);

  unsubs.push(tripRef().onSnapshot(doc=>{
    if(doc.exists){
      tripName = doc.data().name || tripName;
      tripIcon = doc.data().icon || '📒';
      subcats = doc.data().subcats || [];
      currencies = doc.data().currencies || [];
      currencyRates = doc.data().currencyRates || {};
      tripOwnerUid = doc.data().ownerUid || null;
      if(currentView) render();
    } else {
      alert('這個旅程已被刪除');
      localStorage.removeItem(LOCAL_KEY);
      unsubs.forEach(u=>u()); unsubs=[];
      tripId=null; myMemberId=null; myMemberName=null; members=[]; expenses=[]; subcats=[]; currencies=[]; currencyRates={}; tripOwnerUid=null; tripIcon='📒';
      renderHome();
    }
  }));
  unsubs.push(tripRef().collection('members').orderBy('name').onSnapshot({includeMetadataChanges:true}, snap=>{
    members = snap.docs.map(d=>({id:d.id, ...d.data()}));
    pendingWrites.members = snap.metadata.hasPendingWrites;
    render();
  }));
  unsubs.push(tripRef().collection('expenses').onSnapshot({includeMetadataChanges:true}, snap=>{
    expenses = snap.docs.map(d=>({id:d.id, ...d.data()}));
    pendingWrites.expenses = snap.metadata.hasPendingWrites;
    render();
  }));
}

function leaveTrip(){
  if(!confirm('離開這個旅程？（資料不會刪除，之後可用邀請碼重新加入）')) return;
  localStorage.removeItem(LOCAL_KEY);
  unsubs.forEach(u=>u()); unsubs=[];
  tripId=null; myMemberId=null; myMemberName=null; members=[]; expenses=[]; subcats=[]; currencies=[]; currencyRates={}; tripIcon='📒';
  renderHome();
}

function copyInviteCode(){
  const ta = document.createElement('textarea');
  ta.value = tripId; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已複製邀請碼：'+tripId); }
  catch(e){ navigator.clipboard?.writeText(tripId); toast('已複製邀請碼'); }
  ta.remove();
}

function inviteLink(){
  return location.origin + location.pathname + '?trip=' + encodeURIComponent(tripId);
}
function shareInviteLink(){
  const url = inviteLink();
  const shareData = { title: '旅費帳本', text: `一起用「旅費帳本」記錄「${tripName}」的花費吧！點連結就能加入：`, url };
  if(navigator.share){
    navigator.share(shareData).catch(()=>{}); // 使用者取消分享時不用特別處理
    return;
  }
  const ta = document.createElement('textarea');
  ta.value = url; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已複製邀請連結'); }
  catch(e){ navigator.clipboard?.writeText(url); toast('已複製邀請連結'); }
  ta.remove();
}

/* ============ Shell / render ============ */
function renderShell(mainHtml, isHome){
  const app = document.getElementById('app');
  if(isHome){
    app.innerHTML = mainHtml;
    return;
  }
  app.innerHTML = `
  <header class="app">
    <h1>旅費帳本</h1>
    <div class="sub">
      ${tripIcon} ${escHtml(tripName || '')}
      <span class="codepill" onclick="copyInviteCode()">邀請碼 ${tripId}</span>
    </div>
    <div class="ver">v3f2 · ${myMemberName? '你是 '+escHtml(myMemberName) : ''}</div>
    ${!isOnline
      ? `<div class="synctag" style="color:var(--brass-light);margin-top:4px">📴 離線中，變更會先存在這台裝置，恢復連線後自動同步</div>`
      : (hasPending() ? `<div class="synctag" style="color:var(--brass-light);margin-top:4px">🔄 同步中…</div>` : '')
    }
  </header>
  <main id="main">${mainHtml}</main>
  <button class="fab" id="fabAdd" title="新增支出">＋</button>
  <nav class="bottom">
    <div class="item" data-view="expenses"><span class="ic">${NAV_ICONS.expenses}</span>記帳</div>
    <div class="item" data-view="fx"><span class="ic">${NAV_ICONS.fx}</span>匯率</div>
    <div class="item" data-view="analysis"><span class="ic">${NAV_ICONS.analysis}</span>分析</div>
    <div class="item" data-view="settle"><span class="ic">${NAV_ICONS.settle}</span>結算</div>
    <div class="item" data-view="members"><span class="ic">${NAV_ICONS.members}</span>設定</div>
  </nav>
  <div id="modalRoot"></div>`;
  document.querySelectorAll('nav.bottom .item').forEach(el=>{
    el.classList.toggle('active', el.dataset.view===currentView);
    el.addEventListener('click', ()=> setView(el.dataset.view));
  });
  document.getElementById('fabAdd').addEventListener('click', ()=> openExpenseModal(null));
}

function setView(v){ currentView=v; render(); }

function render(){
  if(!tripId) return;
  let html;
  if(currentView==='expenses') html = renderExpenses();
  else if(currentView==='fx') html = renderRates();
  else if(currentView==='settle') html = renderSettle();

  renderShell(html, false);
}

function deleteTrip(){
  const typed = prompt(`此操作會永久刪除「${tripName}」的所有記帳、成員、匯率資料，且無法復原。\n請輸入旅程名稱「${tripName}」以確認刪除：`);

  toast('刪除中…');
  Promise.all([
    tripRef().collection('expenses').get(),
    tripRef().collection('batches').get(),
    tripRef().collection('members').get()
  ]).then(([expSnap, batchSnap, memSnap])=>{
    const allDocs = [...expSnap.docs, ...batchSnap.docs, ...memSnap.docs];
    const chunks = [];
    for(let i=0;i<allDocs.length;i+=450) chunks.push(allDocs.slice(i,i+450));
    let chain = Promise.resolve();
    chunks.forEach(chunk=>{
      chain = chain.then(()=>{
        const batch = db.batch();
        chunk.forEach(d=> batch.delete(d.ref));
        return batch.commit();
      });
    });
    return chain.then(()=> tripRef().delete());
  }).then(()=>{
    localStorage.removeItem(LOCAL_KEY);
    unsubs.forEach(u=>u()); unsubs=[];
    tripId=null; myMemberId=null; myMemberName=null; members=[]; expenses=[]; subcats=[]; currencies=[]; currencyRates={}; tripOwnerUid=null; tripIcon='📒';
    renderHome();
    toast('旅程已刪除');
  }).catch(err=> alert('刪除失敗：'+err.message));
}

/* ---- Foreign-exchange context: figures out, from the form's current state,
   whether this expense is in a foreign currency and (if known) what the TWD rate is.
   Used to decide whether the beneficiary split is entered in foreign currency or TWD. ---- */
function computeFxContextFromDraft(d){
  if(d.paymethod==='cash'){
    if(d.currency && d.currency!=='TWD' && d.currency!=='外幣'){
      const foreignAmount = d.foreignAmount||0;
      return {isForeign:true, currency:d.currency, rate:getRate(d.currency), foreignTotal:foreignAmount};
    }
    if(d.currency==='外幣' && (d.foreignAmount||0)>0){
      // 舊資料：曾經記過金額，但當時幣別尚未確定
      return {isForeign:true, currency:'外幣', rate:null, foreignTotal:d.foreignAmount||0};
    }
    return {isForeign:false, currency:'TWD', rate:1, foreignTotal:0};
  } else {
    const currency = d.currency && d.currency!=='TWD' ? d.currency : '';
    const foreignAmount = currency ? (d.foreignAmount||0) : 0;
    if(currency && foreignAmount>0){
      const rate = d.twdAmount>0 ? (d.twdAmount/foreignAmount) : null;
      return {isForeign:true, currency, rate, foreignTotal:foreignAmount};
    }
    return {isForeign:false, currency:'TWD', rate:1, foreignTotal:0};
  }
}
function computeFxContext(){
  const pmEl = document.querySelector('#payMethodSeg button.sel');
  const paymethod = pmEl ? pmEl.dataset.pm : 'card';
  if(paymethod==='cash'){
    const currency = (document.getElementById('fCurrencyCash')?.value||'').trim().toUpperCase();
    const amountInput = parseFloat(document.getElementById('fForeignCash')?.value) || 0;
    if(currency){
      return {isForeign:true, currency, rate:getRate(currency), foreignTotal:amountInput};
    }
    return {isForeign:false, currency:'TWD', rate:1, foreignTotal:0};
  } else {
    const currency = (document.getElementById('fCurrency')?.value||'').trim().toUpperCase();
    const foreignAmount = parseFloat(document.getElementById('fForeignCard')?.value) || 0;
    const twdAmount = parseFloat(document.getElementById('fTwdCard')?.value) || 0;
    if(currency && currency!=='TWD' && foreignAmount>0){
      const rate = twdAmount>0 ? (twdAmount/foreignAmount) : null;
      return {isForeign:true, currency, rate, foreignTotal:foreignAmount};
    }
    return {isForeign:false, currency:'TWD', rate:1, foreignTotal:0};
  }
}

// 讓使用者知道分析／結算頁在帳單確認前會顯示什麼數字。填了台幣金額後就不再提示估算，因為會直接採用該金額。
function refreshCardRateHint(){
  const hintEl = document.getElementById('cardRateHint');
  if(!hintEl) return;
  const twdCardEl = document.getElementById('fTwdCard');
  const currencyEl = document.getElementById('fCurrency');
  const foreignEl = document.getElementById('fForeignCard');
  if(!twdCardEl || !currencyEl || !foreignEl){ hintEl.textContent=''; return; }
  if(twdCardEl.value){ hintEl.textContent=''; return; }
  const cur = currencyEl.value.trim().toUpperCase();
  const foreignAmount = parseFloat(foreignEl.value) || 0;
  if(!cur || !foreignAmount){ hintEl.textContent=''; return; }
  const rate = getRate(cur);
  hintEl.textContent = rate!=null
    ? `尚未填台幣金額，分析／結算頁會先套用已設定匯率（1 ${cur} = ${fmt(rate)} 台幣）估算為 NT$${fmt(foreignAmount*rate)}，待對照帳單後可回來更新。`
    : `「${cur}」尚未設定匯率，帳單確認前分析／結算頁會先顯示為 NT$0，可到「匯率」頁新增匯率以先看到估算值。`;
}

function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function saveExpense(id){
  const date = document.getElementById('fDate').value || todayStr();
  const title = document.getElementById('fTitle').value.trim();
  const catEl = document.querySelector('#catGrid .catbtn.sel');
  const mainCat = catEl ? catEl.dataset.cat : 'other';
  const subCat = document.getElementById('fSubcat').value.trim();
  const pmEl = document.querySelector('#payMethodSeg button.sel');
  const paymethod = pmEl ? pmEl.dataset.pm : 'card';
  const payerId = document.getElementById('fPayer').value;

  let currency='TWD', foreignAmount=0, twdAmount=0, status='confirmed';

  if(paymethod==='cash'){
    currency = document.getElementById('fCurrencyCash').value.trim().toUpperCase();
    const amountInput = parseFloat(document.getElementById('fForeignCash').value) || 0;
    if(currency){
      foreignAmount = amountInput;
      const rate = getRate(currency);
      if(rate!=null){
        twdAmount = foreignAmount * rate;
        status = 'confirmed';
      } else {
        twdAmount = 0;
        status = 'estimated';
      }
    } else {
      currency = 'TWD';
      foreignAmount = 0;
      twdAmount = amountInput;
      status = 'confirmed';
    }
  } else {
    currency = document.getElementById('fCurrency').value.trim().toUpperCase() || 'TWD';
    foreignAmount = parseFloat(document.getElementById('fForeignCard').value) || 0;
    twdAmount = parseFloat(document.getElementById('fTwdCard').value) || 0;
    status = document.getElementById('fConfirmed').checked ? 'confirmed' : 'estimated';
  }

  const fx = computeFxContext();

  const benefChecks = document.querySelectorAll('#benefList input[type=checkbox]');
  let beneficiaries = [];
  benefChecks.forEach(cb=>{
    if(cb.checked){
      const amtInput = document.querySelector(`#benefList input[data-benefamt="${cb.dataset.benef}"]`);
      const val = amtInput.value ? parseFloat(amtInput.value) : null;
      beneficiaries.push({memberId:cb.dataset.benef, rawVal:val});
    }
  });
  if(beneficiaries.length===0){ alert('請至少選一位受益人'); return; }

  if(fx.isForeign){
    // 直接用外幣分攤金額分配，台幣分攤金額則用已知匯率換算（若尚無匯率則先留空，待補匯率後可重新編輯此筆更新）
    const fixedSum = beneficiaries.reduce((s,b)=> s + (b.rawVal||0), 0);
    const nullCount = beneficiaries.filter(b=>b.rawVal==null).length;
    const remainder = fx.foreignTotal - fixedSum;
    if(nullCount>0){
      const each = remainder / nullCount;
      beneficiaries.forEach(b=>{ if(b.rawVal==null) b.rawVal = each; });
    } else if(Math.abs(remainder) > 0.5){
      if(!confirm(`受益人指定的外幣金額總和 (${fmt(fixedSum)} ${fx.currency}) 與支出外幣金額 (${fmt(fx.foreignTotal)} ${fx.currency}) 不符，仍要儲存嗎？`)) return;
    }
    beneficiaries = beneficiaries.map(b=> ({
      memberId: b.memberId,
      foreignAmount: b.rawVal,
      amount: fx.rate!=null ? b.rawVal * fx.rate : null
    }));
  } else {
    const fixedSum = beneficiaries.reduce((s,b)=> s + (b.rawVal||0), 0);
    const nullCount = beneficiaries.filter(b=>b.rawVal==null).length;
    const remainder = twdAmount - fixedSum;
    if(nullCount>0){
      const each = remainder / nullCount;
      beneficiaries.forEach(b=>{ if(b.rawVal==null) b.rawVal = each; });
    } else if(Math.abs(remainder) > 0.5){
      if(!confirm(`受益人指定金額總和 (NT$${fmt(fixedSum)}) 與支出金額 (NT$${fmt(twdAmount)}) 不符，仍要儲存嗎？`)) return;
    }
    beneficiaries = beneficiaries.map(b=> ({ memberId: b.memberId, amount: b.rawVal, foreignAmount: null }));
  }

  if(subCat && !subcats.includes(subCat)){
    tripRef().update({subcats: firebase.firestore.FieldValue.arrayUnion(subCat)});
  }
  if(currency && currency!=='TWD' && currency!=='外幣' && !currencies.includes(currency)){
    tripRef().update({currencies: firebase.firestore.FieldValue.arrayUnion(currency)});
  }

  const record = {date, title, mainCat, subCat, paymethod, currency, foreignAmount, twdAmount, status, payerId, beneficiaries};
  const docId = id || uid();
  tripRef().collection('expenses').doc(docId).set(record).then(()=>{
    closeModal();
  }).catch(err=> alert('儲存失敗：'+err.message));
}

function deleteExpense(id){
  if(!confirm('確定刪除這筆支出？')) return;
  tripRef().collection('expenses').doc(id).delete().then(()=> closeModal());
}

/* ============ Export CSV ============ */
function csvEscape(val){
  const s = (val===null || val===undefined) ? '' : String(val);
  if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportExpensesCSV(){
  if(expenses.length===0){ alert('尚無支出資料可匯出'); return; }
  const headers = ['日期','標題','主分類','次分類','付款方式','幣別','支出外幣金額','支出台幣金額','對帳狀態','付款人','受益人','受益人分攤金額(台幣)','受益人分攤金額(原幣別)'];
  const rows = [headers];
  const sorted = [...expenses].sort((a,b)=> a.date.localeCompare(b.date));
  sorted.forEach(e=>{
    const payer = memberName(e.payerId);
    const totalTwd = Math.round((liveTwdAmount(e)+Number.EPSILON)*10)/10;
    const statusLabel = liveStatus(e)==='confirmed' ? '已確認' : '估算中';
    const pmLabel = e.paymethod==='cash' ? '現金' : '信用卡';
    (e.beneficiaries||[]).forEach(b=>{
      const benefTwd = Math.round((liveBenefTwd(e,b)+Number.EPSILON)*10)/10;
      const benefForeign = (e.currency && e.currency!=='TWD' && b.foreignAmount!=null) ? b.foreignAmount : '';
      rows.push([
        e.date,
        e.title || catLabel(e.mainCat),
        catLabel(e.mainCat),
        e.subCat || '',
        pmLabel,
        e.currency || 'TWD',
        (e.currency && e.currency!=='TWD') ? e.foreignAmount : '',
        totalTwd,
        statusLabel,
        payer,
        memberName(b.memberId),
        benefTwd,
        benefForeign
      ]);
    });
  });
  const csvContent = rows.map(r=> r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${tripName||'旅費帳本'}_支出明細_${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  toast('已匯出 CSV');
}

/* ============ Analysis ============ */
const CAT_COLORS = {stay:'var(--teal)', food:'var(--brass)', transport:'var(--owe)', other:'var(--owed)'};

function renderCategoryDonut(categoryTotals, total){
  if(total<=0) return '';
  const r=54, strokeW=26, cx=70, cy=70, circumference=2*Math.PI*r;
  let offset=0;
  let segs='';
  CATS.forEach(c=>{
    const amt = categoryTotals[c.id]||0;
    if(amt<=0) return;
    const pct = amt/total;
    const dash = pct*circumference;
    segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CAT_COLORS[c.id]}" stroke-width="${strokeW}" stroke-dasharray="${dash.toFixed(2)} ${circumference.toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
  });
  // 中心文字：不顯示「NT$」、金額取整數，並依字數動態縮小字級，避免長數字超出內圈範圍
  const innerDiameter = (r - strokeW/2) * 2; // 內圈可用寬度（約 82）
  const availWidth = innerDiameter - 10; // 保留一點邊距
  const totalLabel = fmt(Math.round(total));
  const baseFontSize = 15;
  const minFontSize = 9;
  const estFontSize = availWidth / (totalLabel.length * 0.6);
  const valueFontSize = Math.max(minFontSize, Math.min(baseFontSize, estFontSize)).toFixed(1);
  return `<svg viewBox="0 0 140 140" width="180" height="180">
    ${segs}
    <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="11" fill="var(--gray)" font-family="'Noto Sans TC',sans-serif">支出總額</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="${valueFontSize}" font-weight="700" fill="var(--teal)" font-family="'Roboto Mono',monospace">${totalLabel}</text>
  </svg>`;
}

/* ============ Settlement ============ */
function setSettleMode(mode){ settleMode = mode; render(); }

// Greedy min-transaction settlement given a {memberId: netAmount} map.
// Positive net = should receive money, negative = should pay money.
function computeTransfers(net){
  const creditors = members.map(m=>({id:m.id, amt:net[m.id]||0})).filter(x=>x.amt>0.5).sort((a,b)=>b.amt-a.amt);
  const debtors = members.map(m=>({id:m.id, amt:-(net[m.id]||0)})).filter(x=>x.amt>0.5).sort((a,b)=>b.amt-a.amt);
  const transfers = [];
  let ci=0, di=0;
  while(ci<creditors.length && di<debtors.length){
    const pay = Math.min(creditors[ci].amt, debtors[di].amt);
    transfers.push({from:debtors[di].id, to:creditors[ci].id, amt:pay});
    creditors[ci].amt -= pay; debtors[di].amt -= pay;
    if(creditors[ci].amt<0.5) ci++;
    if(debtors[di].amt<0.5) di++;
  }
  return transfers;
}

/* ---- Mode A：所有支出折合台幣，統一結算一次 ---- */

function buildSummaryTextTWD(net, transfers){
  let lines = ['📒 '+tripName+' 旅費結算（折合台幣）', ''];
  members.forEach(m=>{
    const n = net[m.id];
    lines.push(`${m.name}：${n>=0?'應收':'應付'} NT$${fmt(Math.abs(n))}`);
  });
  lines.push('', '💸 建議轉帳：');
  if(transfers.length===0) lines.push('已打平，無需轉帳');
  transfers.forEach(t=> lines.push(`${memberName(t.from)} → ${memberName(t.to)}：NT$${fmt(t.amt)}`));
  return lines.join('\n');
}

/* ---- Mode B：依幣別分開結算，每種幣別各自算一次淨額與轉帳建議 ----
   TWD 一律用 twdAmount／beneficiary.amount（本來就是台幣）。
   外幣（currency 為明確幣別代碼且 foreignAmount>0）則用 foreignAmount，
   受益人的外幣分攤金額優先用其原生輸入的 foreignAmount；
   舊資料沒有這個欄位時，才用台幣分攤比例反推（近似值）。
   currency 未確定（現金沒填幣別、或信用卡外幣消費未填外幣金額）的支出無法準確拆分，
   會被排除並另外提示，請先補資料或改用「折合台幣結算」。
*/
function groupExpensesByCurrency(){
  const groups = {}; // currency -> array of {expense, amountInCurrency, benefShares:{memberId:amt}}
  const unresolved = [];
  expenses.forEach(e=>{
    if(e.currency==='TWD'){
      const key='TWD';
      (groups[key]=groups[key]||[]).push({
        e, amount: e.twdAmount,
        shares: Object.fromEntries(e.beneficiaries.map(b=>[b.memberId, b.amount||0]))
      });
    } else if(e.currency && e.currency!=='外幣' && e.foreignAmount>0){
      const key = e.currency;
      const shares = {};
      e.beneficiaries.forEach(b=>{
        if(b.foreignAmount!=null){
          // 新資料：受益人的外幣分攤是直接輸入的，準確值
          shares[b.memberId] = b.foreignAmount;
        } else if(e.twdAmount>0){
          // 舊資料：只有台幣分攤，用台幣分攤比例反推外幣分攤（近似值）
          shares[b.memberId] = (b.amount||0)/e.twdAmount * e.foreignAmount;
        } else {
          // 舊資料且台幣金額也未知，退而用人數均分外幣
          const n = e.beneficiaries.length || 1;
          shares[b.memberId] = e.foreignAmount/n;
        }
      });
      (groups[key]=groups[key]||[]).push({e, amount: e.foreignAmount, shares});
    } else {
      unresolved.push(e);
    }
  });
  return {groups, unresolved};
}

function renderSettleByCurrency(){
  const {groups, unresolved} = groupExpensesByCurrency();
  const currencyKeys = Object.keys(groups).sort((a,b)=> a==='TWD'? -1 : b==='TWD'? 1 : a.localeCompare(b));

  if(currencyKeys.length===0){
    return `<div class="empty"><div class="big">🧮</div>目前沒有可分幣別結算的支出</div>`;
  }

  let allSummaryLines = ['📒 '+tripName+' 旅費結算（依幣別分開）', ''];
  let cardsHtml = '';

  currencyKeys.forEach(cur=>{
    const items = groups[cur];
    const paid = {}, owed = {};
    members.forEach(m=>{ paid[m.id]=0; owed[m.id]=0; });
    items.forEach(({e, amount, shares})=>{
      if(paid[e.payerId]!==undefined) paid[e.payerId]+=amount;
      Object.keys(shares).forEach(mid=>{ if(owed[mid]!==undefined) owed[mid]+=shares[mid]; });
    });
    const net = {};
    members.forEach(m=>{ net[m.id] = paid[m.id]-owed[m.id]; });
    const transfers = computeTransfers(net);
    const prefix = cur==='TWD' ? 'NT$' : '';
    const suffix = cur==='TWD' ? '' : ' '+cur;

    const rows = members.map(m=>{
      if(Math.abs(paid[m.id])<0.01 && Math.abs(owed[m.id])<0.01) return '';
      return `
      <div class="settlerow">
        <div class="row" style="gap:8px"><div class="avatar" style="width:26px;height:26px;font-size:11px">${escHtml(initials(m.name))}</div>${escHtml(m.name)}</div>
        <div style="text-align:right">
          <div class="mono" style="font-weight:700;color:${net[m.id]>=0?'var(--owed)':'var(--owe)'}">${net[m.id]>=0? '+':''}${fmt(net[m.id])}${suffix}</div>
          <div class="hint">實付 ${prefix}${fmt(paid[m.id])}${suffix} ／ 應付 ${prefix}${fmt(owed[m.id])}${suffix}</div>
        </div>
      </div>`;
    }).join('');

    const transferRows = transfers.map(t=>`
      <div class="transfer">
        <div style="flex:1">${escHtml(memberName(t.from))}</div>
        <div class="arrow">→</div>
        <div style="flex:1">${escHtml(memberName(t.to))}</div>
        <div class="mono" style="font-weight:700">${prefix}${fmt(t.amt)}${suffix}</div>
      </div>`).join('') || `<div class="hint">此幣別已打平，不需轉帳。</div>`;

    cardsHtml += `
    <div class="card">
      <h2>${cur==='TWD'? '台幣 TWD':escHtml(cur)+' 現金／消費'}</h2>
      ${rows || `<div class="hint">此幣別無相關收支</div>`}
      <div class="stub">
        <h2 style="margin-bottom:8px">建議轉帳</h2>
        ${transferRows}
      </div>
    </div>`;

    allSummaryLines.push(`【${cur==='TWD'?'台幣':cur}】`);
    members.forEach(m=>{
      const n = net[m.id];
      if(Math.abs(n)<0.01) return;
      allSummaryLines.push(`${m.name}：${n>=0?'應收':'應付'} ${prefix}${fmt(Math.abs(n))}${suffix}`);
    });
    if(transfers.length===0) allSummaryLines.push('已打平，無需轉帳');
    transfers.forEach(t=> allSummaryLines.push(`${memberName(t.from)} → ${memberName(t.to)}：${prefix}${fmt(t.amt)}${suffix}`));
    allSummaryLines.push('');
  });

  const summaryText = allSummaryLines.join('\n');

  return `
  <div class="banner">💡 每種幣別分開計算淨額與轉帳建議，適合還在當地、想直接用現金找補的情況。</div>
  ${unresolved.length>0? `<div class="banner">⚠️ 有 ${unresolved.length} 筆支出的幣別尚未確定（現金沒填幣別，或刷卡未填外幣金額），暫時無法分幣別結算，請先到「記帳」補上資料，或改用「折合台幣結算」檢視。</div>`:''}
  ${cardsHtml}
  <button class="btn ghost on-dark block" onclick="copySummary()">📋 複製結算文字</button>
  <textarea id="summaryTextHidden" style="position:absolute; left:-9999px;">${escHtml(summaryText)}</textarea>
  `;
}

function copySummary(){
  const ta = document.getElementById('summaryTextHidden');
  ta.select(); ta.setSelectionRange(0,99999);
  try{ document.execCommand('copy'); toast('已複製結算文字'); }
  catch(e){ navigator.clipboard?.writeText(ta.value); toast('已複製結算文字'); }
}

boot();
</script>
</body>
</html>
